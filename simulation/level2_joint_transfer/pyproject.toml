[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "level2-joint-transfer"
version = "0.3.0"
description = "Level 2 同步移动-降深波形优化与鲁棒蒙特卡洛验证"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "Pillow>=9.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
level0-static-trap = "level0_static_trap.cli:main"
level1-transfer-1d = "level1_transfer_1d.cli:main"
level2-joint-transfer = "level2_joint_transfer.cli:main"
level3-3d-transport = "level3_3d_transport_lensing.level3_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["slow: 较慢的集成测试"]
