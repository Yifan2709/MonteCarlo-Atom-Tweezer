[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "level2b-speed-modify"
version = "0.1.0"
description = "Level 2B AOD 移动速度边界与变速剖面验证（复用 level0/1/2 基线，不改动原实现）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "Pillow>=9.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
level2b-speed-limit = "level2b_speed_limit.level2b_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["slow: 较慢的集成测试"]
