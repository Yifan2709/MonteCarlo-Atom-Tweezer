[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "level0-static-trap"
version = "0.1.0"
description = "一维单原子高斯光镊的 Level 0 静态数值自洽检查"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "Pillow>=9.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
level0-static-trap = "level0_static_trap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

