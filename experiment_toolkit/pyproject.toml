[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tweezer-experiment"
version = "1.0.0"
description = "Offline experiment planning toolkit for tweezer transport: input validation, protocol compilation, forward prediction, constrained control search, and waveform export with read-back verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tweezer-experiment = "tweezer_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tweezer_experiment = ["py.typed"]
